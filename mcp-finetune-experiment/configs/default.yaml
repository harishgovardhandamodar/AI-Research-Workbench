# Default experiment config (mcp-finetune-experiment).
# Paper-specific values are set per stage via mcp.experiment.update_config /
# mcp.train.set_hyperparams.
experiment:
  name: mcp-agent-finetune
  base_model: Qwen/Qwen2.5-0.5B-Instruct
  seed: 0

training:
  method: lora            # lora | qlora | full | rft | grpo | decoupled
  lora_rank: 8
  lora_alpha: 16
  learning_rate: 5.0e-05
  epochs: 1
  batch_size: 4
  max_seq_len: 1024
  quantization: null      # 4bit / 8bit for QLoRA
  real: false             # true once torch/transformers/peft are installed

eval:
  judge_model: null       # e.g. the local model to run mcp.eval.llm_judge
  subset: 200

data:
  train_frac: 0.8
  val_frac: 0.1
