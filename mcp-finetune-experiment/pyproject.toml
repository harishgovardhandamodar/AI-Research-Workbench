[project]
name = "mcp-finetune-experiment"
version = "0.1.0"
description = "MCP-native incremental fine-tuning experiment for tool-using agents (Jupyter + Python)."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
    "pyyaml>=6.0",
    "openai>=1.30",
    "jupyter_server>=2.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
train = [
    "torch>=2.2",
    "transformers>=4.44",
    "peft>=0.12",
    "trl>=0.10",
    "accelerate>=0.33",
    "datasets>=2.20",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["mcp_servers", "training", "data", "eval", "experiment", "common"]

[tool.setuptools.package-data]
mcp_servers = ["py.typed"]
