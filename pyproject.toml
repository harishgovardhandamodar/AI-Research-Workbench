[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fox-science-workbench"
version = "0.1.0"
description = "Local - Open - Agentic Experimentation Workbench (chat + agent + persistent kernels + notebooks)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "openai>=1.30",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "numpy", "pandas", "scipy", "matplotlib", "scikit-learn",
    # Research Knowledge Graphs (vendored hive-research-gpu app logic)
    "arxiv>=2.1.0",
    "PyMuPDF>=1.25.0",
    "requests>=2.32.0",
    "PyYAML>=6.0.0",
]

[project.optional-dependencies]
jupyter = ["jupyter_server>=2.0"]
audit = ["streamlit>=1.30"]
# LangChain / LangGraph orchestration for the reliable agent coordinator
# (optional: the classic coordinator loop works without these). Imported lazily.
agent = [
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
]

# Hive Research Companion — local Feynman + Perplexity Computer
hive = [
    "typer>=0.12",
    "httpx>=0.27",
    "pydantic>=2.5",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "textual>=0.80",
    "pyyaml>=6.0",
]

[project.scripts]
fox = "cli.main:main"
hive = "hive_companion.cli:app"
agent-audit = "audit.cli:main"
fox-kernel = "backend.kernels.server:main"

[project.entry-points."jupyter_server.extension"]
fox = "jupyter_fox"

[tool.setuptools]
packages = ["jupyter_fox", "cli", "audit"]
[tool.setuptools.package-data]
cli = ["manual.md"]
