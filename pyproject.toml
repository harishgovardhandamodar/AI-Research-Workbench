[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fox-science-workbench"
version = "0.1.0"
description = "Fox - local experiment workbench (chat + agent + persistent kernels + notebooks)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "openai>=1.30",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "numpy", "pandas", "scipy", "matplotlib", "scikit-learn",
    # Research Knowledge Graphs (vendored hive-research-gpu app logic)
    "arxiv>=2.1.0",
    "PyMuPDF>=1.25.0",
    "requests>=2.32.0",
    "PyYAML>=6.0.0",
]

[project.optional-dependencies]
jupyter = ["jupyter_server>=2.0"]
audit = ["streamlit>=1.30"]

[project.scripts]
fox = "cli.main:main"
agent-audit = "audit.cli:main"
fox-kernel = "backend.kernels.server:main"

[project.entry-points."jupyter_server.extension"]
fox = "jupyter_fox"

[tool.setuptools]
packages = ["jupyter_fox", "cli", "audit"]
[tool.setuptools.package-data]
cli = ["manual.md"]
